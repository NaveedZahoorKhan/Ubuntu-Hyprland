# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 2
  gaps_out = 4

  # Keep reset-theme window borders stable instead of following wallust wallpaper colors.
  col.active_border = rgba(5e81acff)
  col.inactive_border = rgba(2e3440aa)
}

decoration {
  rounding = 10
  
  active_opacity = 1.0
  inactive_opacity = 0.9
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.1
  dim_special = 0.8

  shadow {
    enabled = true
    range = 3
    render_power = 1

    color = rgba(5e81ac88)
    color_inactive = rgba(2e344066)
  }

  blur {
    enabled = true
    size = 6
    passes = 3
    new_optimizations = true
    xray = true
    ignore_opacity = true
    special = true
    # Keep browser autofill menus and JetBrains completion popups visible.
    popups = false
  }
}

group {
  col.border_active = rgba(5e81acff)

	groupbar {
		col.active = $color0
  }
}
