# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

# Tap Super by itself to open or close the app launcher.
bindr = $mainMod, Super_L, exec, pkill rofi || rofi -show drun -modes drun,filebrowser,run,window
bindr = $mainMod, Super_R, exec, pkill rofi || rofi -show drun -modes drun,filebrowser,run,window

# Make the hardware Print Screen key work without holding Super.
bindd = , Print, screenshot now, exec, $scriptsDir/ScreenShot.sh --now
bindd = SHIFT, Print, screenshot area, exec, $scriptsDir/ScreenShot.sh --area
bindd = CTRL, Print, screenshot in 5s, exec, $scriptsDir/ScreenShot.sh --in5
bindd = CTRL SHIFT, Print, screenshot in 10s, exec, $scriptsDir/ScreenShot.sh --in10

# Move the active window directly between monitors. This is more reliable than
# dragging tiled windows across displays, especially with mixed screen heights.
bindd = $mainMod CTRL ALT, left, move window to left monitor, movewindow, mon:l
bindd = $mainMod CTRL ALT, right, move window to right monitor, movewindow, mon:r
bindd = $mainMod CTRL ALT, up, move window to upper monitor, movewindow, mon:u
bindd = $mainMod CTRL ALT, down, move window to lower monitor, movewindow, mon:d

# Adjust opacity on the active window only.
bindd = $mainMod ALT, minus, reduce active window opacity, exec, $UserScripts/WindowOpacity.sh decrease
bindd = $mainMod ALT, equal, increase active window opacity, exec, $UserScripts/WindowOpacity.sh increase
bindd = $mainMod ALT, 0, reset active window opacity, exec, $UserScripts/WindowOpacity.sh reset
bindd = $mainMod ALT, W, start or next mpvpaper live wallpaper, exec, $UserScripts/MpvpaperLive.sh toggle
bindd = $mainMod ALT, N, next mpvpaper video wallpaper, exec, $UserScripts/MpvpaperLive.sh next
bindd = $mainMod ALT, P, previous mpvpaper video wallpaper, exec, $UserScripts/MpvpaperLive.sh previous
bindd = $mainMod ALT SHIFT, W, stop mpvpaper live wallpaper, exec, $UserScripts/MpvpaperLive.sh stop

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME









