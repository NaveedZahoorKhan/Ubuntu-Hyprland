# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

# Ferdium/Teams XWayland menus can expose a large colored shadow/blur rectangle.
windowrule = match:class ^([Ff]erdium)$, no_shadow on
windowrule = match:class ^([Ff]erdium)$, no_blur on
windowrule = match:class ^([Ff]erdium)$, opacity 1.0 1.0

# Keep transient menus visible in apps that rely heavily on xdg-popups.
windowrule = match:class ^([Gg]oogle-chrome(-beta|-dev|-unstable)?|chrome-.+-Default|[Cc]hromium)$, no_blur on
windowrule = match:class ^([Gg]oogle-chrome(-beta|-dev|-unstable)?|chrome-.+-Default|[Cc]hromium)$, opacity 1.0 1.0
windowrule = match:class ^(jetbrains-.+)$, no_blur on
windowrule = match:class ^(jetbrains-.+)$, opacity 1.0 1.0
